name: 버그 리포트
description: 의도한 대로 동작하지 않는 기능을 보고합니다.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        버그를 발견해 주셔서 감사합니다. 재현 가능한 정보를 최대한 구체적으로 적어 주세요.

  - type: checkboxes
    id: preflight
    attributes:
      label: 사전 확인
      options:
        - label: 이미 등록된 이슈가 아닌지 검색했습니다.
          required: true
        - label: 최신 `main` 브랜치에서도 동일하게 재현됩니다.
          required: true

  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 무엇이 문제인가요?
      placeholder: "예: 로그인 후 대시보드로 이동하면 500 에러가 발생합니다."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 문제를 재현하는 순서를 단계별로 적어 주세요.
      placeholder: |
        1. `/login` 페이지에 접속한다.
        2. 등록된 계정으로 로그인한다.
        3. ...
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래 어떻게 동작해야 하나요?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로는 어떻게 동작하나요?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 실행 환경
      multiple: true
      options:
        - 로컬 (Local)
        - 개발 서버 (Dev)
        - 운영 (Prod)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷
      description: 콘솔 로그, 스택 트레이스, 스크린샷이 있다면 첨부해 주세요.
      render: shell
    validations:
      required: false
