name: 기능 제안
description: 새로운 기능이나 개선 사항을 요청합니다.
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        기능 제안을 남겨 주셔서 감사합니다. "무엇을"뿐만 아니라 "왜"가 필요합니다.

  - type: checkboxes
    id: preflight
    attributes:
      label: 사전 확인
      options:
        - label: 이미 등록된 이슈나 진행 중인 PR이 아닌지 검색했습니다.
          required: true

  - type: textarea
    id: background
    attributes:
      label: 배경 / 문제
      description: 어떤 불편함이나 필요 때문에 이 기능이 필요한가요?
      placeholder: "예: 구독 갱신일이 다가와도 알림이 없어 결제를 놓치는 경우가 있습니다."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 어떻게 해결하고 싶은지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건 (Acceptance Criteria)
      description: 이 이슈가 완료되었다고 판단할 수 있는 조건을 체크리스트로 적어 주세요.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안 / 참고 자료
      description: 고려한 다른 방법이나 참고할 만한 링크가 있다면 적어 주세요.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 영향 범위
      multiple: true
      options:
        - API
        - 인증 / 인가
        - 구독 관리
        - 결제
        - 알림
        - 화면 (Mustache)
        - 인프라 / 배포
        - 기타
    validations:
      required: true
