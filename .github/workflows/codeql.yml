name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (java)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설정
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: CodeQL 초기화
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: 빌드
        uses: github/codeql-action/autobuild@v4

      - name: 분석
        uses: github/codeql-action/analyze@v4
