name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    name: PR Title Convention
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: PR 제목 검사
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            perf
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^\S.*$
          subjectPatternError: |
            PR 제목이 컨벤션을 따르지 않습니다.
            형식: <type>: <설명>
            예시: feat: 구독 목록 조회 API 추가
