services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: subflow:latest
    container_name: subflow-app
    restart: unless-stopped
    user: "1000:1000"
    ports:
      # 호스트 loopback에만 노출한다. 외부 공개는 Cloudflare Tunnel이 담당한다.
      - "127.0.0.1:${APP_PORT:-19007}:8080"
    env_file:
      # .env에 실제 비밀값을 둔다. 없으면 앱이 fail-closed로 기동을 거부한다.
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod,oauth
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-subflow}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      # 비루트(1000:1000) 사용자가 업로드 임시 파일을 쓸 수 있어야 한다.
      - /uploads:size=64m,mode=0700,uid=1000,gid=1000
    healthcheck:
      # Temurin Ubuntu 이미지의 bash /dev/tcp 로 애플리케이션 포트를 확인한다.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge
      - internal

  db:
    image: postgres:17-alpine
    container_name: subflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-subflow}
      POSTGRES_USER: ${DB_USERNAME:-subflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
    # 운영에서는 DB 포트를 호스트에 공개하지 않는다.

networks:
  edge: {}          # app의 Google OAuth egress
  internal:
    internal: true  # db는 외부 egress 불가

volumes:
  pgdata: {}
