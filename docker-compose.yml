services:
  postgres:
    image: postgres:17-alpine
    container_name: subflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-subflow}
      POSTGRES_USER: ${DB_USERNAME:-subflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-subflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - subflow-postgres-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-subflow} -d ${DB_NAME:-subflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  subflow-postgres-data:
