server:
  servlet:
    session:
      cookie:
        secure: false

spring:
  datasource:
    url: jdbc:h2:mem:subflow-local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate

subflow:
  auth:
    mode: demo
  security:
    allowed-origins:
      - http://localhost:8080
      - http://127.0.0.1:19007
    trust-cloudflare-headers: false
    audit-hash-pepper: demo-pepper
    rate-limit:
      enabled: false

logging:
  level:
    org.hibernate.SQL: debug
