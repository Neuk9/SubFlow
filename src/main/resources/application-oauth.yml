spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:subflow}
    username: ${DB_USERNAME:subflow}
    password: ${DB_PASSWORD:subflow}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile

subflow:
  auth:
    enabled: true

logging:
  level:
    org.hibernate.SQL: warn
