server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:subflow}
    username: ${DB_USERNAME:subflow}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate

subflow:
  auth:
    mode: oauth
  security:
    allowed-origins:
      - https://subflow.stda.app
    trust-cloudflare-headers: true
    audit-hash-pepper: ${AUDIT_HASH_PEPPER}
    rate-limit:
      enabled: true

logging:
  level:
    org.hibernate.SQL: warn
