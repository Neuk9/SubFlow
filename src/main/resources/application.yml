spring:
  profiles:
    default: local
  application:
    name: SubFlow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:subflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mustache:
    suffix: .mustache

server:
  port: ${SERVER_PORT:8080}
