spring:
  application:
    name: SubFlow
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      location: /tmp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:subflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mustache:
    suffix: .mustache

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

