spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:subflow-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

subflow:
  auth:
    mode: demo
  security:
    allowed-origins:
      - http://localhost:8080
      - http://127.0.0.1:19007
    trust-cloudflare-headers: false
    audit-hash-pepper: demo-pepper
    rate-limit:
      enabled: false

logging:
  level:
    org.hibernate.SQL: warn
    org.springframework: warn
